<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>成都天气与芭比换装小程序</title>
    <style>
        :root {
            --bg-lavender: #f0e6ff;
            --main-purple: #9d8ec7;
            --dark-purple: #5c4e8c;
            --light-purple: #f8f4ff;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.9);
            --card-shadow: 0 8px 24px rgba(157, 142, 199, 0.18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e8ddf5 0%, #f3ebfc 50%, #e5d8f6 100%);
            color: var(--dark-purple);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            height: 92vh;
            max-height: 880px;
            background: rgba(248, 244, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 36px;
            border: 2px solid var(--glass-border);
            box-shadow: 0 16px 40px rgba(118, 93, 161, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .header-bar {
            padding: 12px 20px 8px;
            text-align: center;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            background: linear-gradient(45deg, #6c529d, #a272c4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 8px 12px 12px;
            min-height: 0;
        }

        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .left-panel, .right-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
        }

        /* 1. 天气与熊猫卡片 */
        .weather-panda-card {
            height: 48%;
            background: linear-gradient(180deg, #e1f5fe 0%, #e8f5e9 60%, #f3e5f5 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
        }

        .weather-info {
            width: 90%;
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.85);
            padding: 6px 10px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .weather-city { font-size: 11px; font-weight: 700; color: var(--dark-purple); }
        .weather-temp { font-size: 16px; font-weight: 800; color: #6a4fa3; }

        .panda-wrapper {
            position: relative;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* 2. 穿搭选择框 */
        .outfit-selector-card {
            height: 52%;
            padding: 8px;
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--dark-purple);
            margin-bottom: 6px;
        }

        .category-tabs {
            display: flex;
            gap: 2px;
            background: rgba(220, 205, 240, 0.4);
            padding: 3px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 10px;
            padding: 4px 0;
            border-radius: 7px;
            color: #6b5c8d;
            font-weight: 600;
            cursor: pointer;
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--dark-purple);
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .grid-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            overflow-y: auto;
        }

        .item-frame {
            aspect-ratio: 1;
            border: 2px dashed rgba(157, 142, 199, 0.4);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.65);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            padding: 4px;
        }

        .item-frame.selected {
            border: 2px solid #8e62d4;
            background: rgba(240, 230, 255, 0.9);
            box-shadow: 0 0 8px rgba(142, 98, 212, 0.3);
        }

        .item-preview {
            width: 100%;
            height: 65%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
        }

        .item-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .frame-label {
            font-size: 9px;
            color: #7d6b9d;
            text-align: center;
            margin-top: 2px;
            font-weight: 600;
        }

        /* 3. 右侧芭比舞台 */
        .barbie-avatar-card {
            height: 72%;
            position: relative;
            background: radial-gradient(circle at 50% 30%, rgba(255, 245, 255, 1) 0%, rgba(230, 215, 250, 0.8) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .barbie-character {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: floatAnim 3s infinite ease-in-out;
            transition: transform 0.5s ease;
        }

        @keyframes floatAnim {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .style-tag {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 9px;
            color: var(--dark-purple);
            font-weight: 600;
            white-space: nowrap;
        }

        /* 4. 右下任务清单 */
        .task-list-card {
            height: 28%;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .task-items {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 6px;
            border-radius: 8px;
        }

        .task-checkbox {
            width: 14px;
            height: 14px;
            accent-color: #8e62d4;
        }

        .task-text {
            color: #554477;
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 10px;
        }

        .action-bar {
            padding: 8px 12px 12px;
        }

        .apply-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #ab8beb 0%, #8865d4 100%);
            color: white;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(136, 101, 212, 0.35);
            cursor: pointer;
        }

        .apply-btn:active {
            transform: scale(0.97);
        }

        .file-input { display: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 顶部 Title -->
        <div class="header-bar">
            <span style="font-size: 12px;">🌸 成都</span>
            <span class="header-title">CHENGDU OUTFIT</span>
            <span style="font-size: 12px;">✨ 芭比换装</span>
        </div>

        <div class="main-content">
            <!-- 左侧区域 -->
            <div class="left-panel">
                <!-- 左上：天气与成都大熊猫 -->
                <div class="glass-card weather-panda-card">
                    <div class="weather-info">
                        <div>
                            <div class="weather-city">成都 · 熊猫基地</div>
                            <div style="font-size: 9px; color: #7d6b9d;">22°C 清爽适宜</div>
                        </div>
                        <div class="weather-temp">⛅</div>
                    </div>

                    <!-- 矢量大熊猫与竹林 (保底 100% 显示) -->
                    <div class="panda-wrapper">
                        <svg width="140" height="90" viewBox="0 0 140 90">
                            <!-- 竹林 -->
                            <rect x="15" y="0" width="6" height="90" rx="3" fill="#a8e6cf" />
                            <rect x="120" y="0" width="6" height="90" rx="3" fill="#a8e6cf" />
                            <!-- 熊猫耳朵 -->
                            <circle cx="50" cy="32" r="10" fill="#333" />
                            <circle cx="90" cy="32" r="10" fill="#333" />
                            <!-- 熊猫头部 -->
                            <circle cx="70" cy="48" r="28" fill="#fff" stroke="#e0e0e0" stroke-width="2" />
                            <!-- 黑眼圈与黑眼睛 -->
                            <ellipse cx="58" cy="46" rx="7" ry="5" fill="#333" transform="rotate(-15 58 46)" />
                            <ellipse cx="82" cy="46" rx="7" ry="5" fill="#333" transform="rotate(15 82 46)" />
                            <circle cx="60" cy="46" r="2" fill="#fff" />
                            <circle cx="80" cy="46" r="2" fill="#fff" />
                            <!-- 鼻子与腮红 -->
                            <ellipse cx="70" cy="54" rx="4" ry="3" fill="#333" />
                            <circle cx="50" cy="56" r="4" fill="#ffb7b2" opacity="0.7" />
                            <circle cx="90" cy="56" r="4" fill="#ffb7b2" opacity="0.7" />
                            <!-- 身体 -->
                            <ellipse cx="70" cy="85" rx="30" ry="15" fill="#fff" stroke="#e0e0e0" stroke-width="2" />
                        </svg>
                    </div>
                </div>

                <!-- 左下：穿搭分类选择框架 -->
                <div class="glass-card outfit-selector-card">
                    <div class="section-title">👔 穿搭选择框架</div>
                    <div class="category-tabs">
                        <button class="tab-btn active" onclick="switchCategory('clothes')">衣服</button>
                        <button class="tab-btn" onclick="switchCategory('acc')">配饰</button>
                        <button class="tab-btn" onclick="switchCategory('shoes')">鞋子</button>
                        <button class="tab-btn" onclick="switchCategory('bags')">包包</button>
                    </div>
                    <div class="grid-container" id="gridContainer"></div>
                </div>
            </div>

            <!-- 右侧区域 -->
            <div class="right-panel">
                <!-- 右上：真人卡通化芭比形象 (保底 100% 显示) -->
                <div class="glass-card barbie-avatar-card">
                    <div class="barbie-character" id="barbieDoll">
                        <svg width="150" height="230" viewBox="0 0 150 230">
                            <!-- 芭比波浪长发 (金色) -->
                            <path d="M 45 60 C 20 90, 20 160, 40 190 Q 75 210 110 190 C 130 160, 130 90, 105 60 Z" fill="#ffe082" />
                            <!-- 面部轮廓 -->
                            <ellipse cx="75" cy="65" rx="26" ry="30" fill="#ffedd8" />
                            <!-- 芭比精致大眼睛 -->
                            <ellipse cx="63" cy="62" rx="5" ry="7" fill="#3a86ff" />
                            <ellipse cx="87" cy="62" rx="5" ry="7" fill="#3a86ff" />
                            <circle cx="61" cy="60" r="2" fill="#fff" />
                            <circle cx="85" cy="60" r="2" fill="#fff" />
                            <!-- 长睫毛 -->
                            <path d="M 56 55 Q 63 50 70 55" stroke="#333" stroke-width="2" fill="none" />
                            <path d="M 80 55 Q 87 50 94 55" stroke="#333" stroke-width="2" fill="none" />
                            <!-- 腮红与唇彩 -->
                            <circle cx="56" cy="72" r="5" fill="#ff8a80" opacity="0.5" />
                            <circle cx="94" cy="72" r="5" fill="#ff8a80" opacity="0.5" />
                            <path d="M 70 82 Q 75 87 80 82" stroke="#ff4081" stroke-width="3" fill="none" stroke-linecap="round" />
                            
                            <!-- 脖子 -->
                            <rect x="71" y="90" width="8" height="12" fill="#ffedd8" />
                            
                            <!-- 可换色的连衣裙/服装 -->
                            <path id="barbieDress" d="M 58 100 L 92 100 L 115 190 L 35 190 Z" fill="#ab8beb" />
                            <!-- 连衣裙精致花边 -->
                            <path d="M 58 100 Q 75 110 92 100" stroke="#fff" stroke-width="2" fill="none" />
                            
                            <!-- 胳膊 -->
                            <path d="M 58 102 C 45 120, 45 140, 42 155" stroke="#ffedd8" stroke-width="7" stroke-linecap="round" fill="none" />
                            <path d="M 92 102 C 105 120, 105 140, 108 155" stroke="#ffedd8" stroke-width="7" stroke-linecap="round" fill="none" />
                            
                            <!-- 可换色的手提包 -->
                            <rect id="barbieBag" x="102" y="145" width="22" height="18" rx="4" fill="#9575cd" />
                            <path d="M 107 145 Q 113 135 119 145" stroke="#fff" stroke-width="2" fill="none" />
                        </svg>
                    </div>
                    <div class="style-tag">✨ 真人卡通 · 芭比公主</div>
                </div>

                <!-- 右下：3行可勾选任务清单 -->
                <div class="glass-card task-list-card">
                    <div class="section-title">📝 今日打卡清单</div>
                    <div class="task-items">
                        <div class="task-item">
                            <input type="checkbox" class="task-checkbox" checked>
                            <input type="text" class="task-text" value="选一套清冷淡紫色搭配">
                        </div>
                        <div class="task-item">
                            <input type="checkbox" class="task-checkbox">
                            <input type="text" class="task-text" value="成都熊猫基地打卡合影">
                        </div>
                        <div class="task-item">
                            <input type="checkbox" class="task-checkbox">
                            <input type="text" class="task-text" value="拍一张芭比公主风格照">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部提交按钮 -->
        <div class="action-bar">
            <button class="apply-btn" onclick="applyOutfit()">✨ 生成到右边芭比形象</button>
        </div>
    </div>

    <!-- 隐藏上传控件 -->
    <input type="file" id="imageUploader" class="file-input" accept="image/*" onchange="handleImageUpload(event)">

    <script>
        // 预设数据与矢量图标
        const categoriesData = {
            clothes: [
                { id: 'c1', name: '淡紫风衣', icon: '🧥', color: '#ab8beb', selected: true },
                { id: 'c2', name: '清冷粉裙', icon: '👗', color: '#f48fb1', selected: false },
                { id: 'c3', name: '加入图片', isUploadSlot: true }
            ],
            acc: [
                { id: 'a1', name: '珍珠发带', icon: '👑', color: '#ffffff', selected: true },
                { id: 'a2', name: '复古墨镜', icon: '🕶️', color: '#90a4ae', selected: false },
                { id: 'a3', name: '加入图片', isUploadSlot: true }
            ],
            shoes: [
                { id: 's1', name: '芭比短靴', icon: '👢', color: '#f48fb1', selected: true },
                { id: 's2', name: '高跟凉鞋', icon: '👠', color: '#cfd8dc', selected: false },
                { id: 's3', name: '加入图片', isUploadSlot: true }
            ],
            bags: [
                { id: 'b1', name: '淡紫链条包', icon: '👜', color: '#9575cd', selected: true },
                { id: 'b2', name: '可爱草编包', icon: '🛍️', color: '#d7ccc8', selected: false },
                { id: 'b3', name: '加入图片', isUploadSlot: true }
            ]
        };

        let currentCategory = 'clothes';

        // 渲染分类列表
        function renderCategoryFrames() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';

            categoriesData[currentCategory].forEach(item => {
                const frame = document.createElement('div');
                frame.className = `item-frame ${item.selected ? 'selected' : ''}`;

                if (item.isUploadSlot) {
                    frame.innerHTML = `<div class="item-preview" style="font-size:22px;color:#9d8ec7;">➕</div><div class="frame-label">加入图片</div>`;
                    frame.onclick = () => document.getElementById('imageUploader').click();
                } else if (item.img) {
                    frame.innerHTML = `<div class="item-preview"><img src="${item.img}" /></div><div class="frame-label">${item.name}</div>`;
                    frame.onclick = () => selectFrame(item.id);
                } else {
                    frame.innerHTML = `<div class="item-preview">${item.icon}</div><div class="frame-label">${item.name}</div>`;
                    frame.onclick = () => selectFrame(item.id);
                }
                container.appendChild(frame);
            });
        }

        function switchCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', ['clothes', 'acc', 'shoes', 'bags'][idx] === cat);
            });
            renderCategoryFrames();
        }

        function selectFrame(id) {
            categoriesData[currentCategory].forEach(i => i.selected = (i.id === id));
            renderCategoryFrames();
        }

        // 上传本地图片处理
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const list = categoriesData[currentCategory];
                const newId = 'upload_' + Date.now();
                list.unshift({ id: newId, name: '自定义服装', img: evt.target.result, color: '#ab8beb', selected: true });
                list.forEach(i => { if (i.id !== newId) i.selected = false; });
                renderCategoryFrames();
            };
            reader.readAsDataURL(file);
        }

        // 核心换装逻辑：将选中的服装与色彩更新到右侧芭比身上
        function applyOutfit() {
            const selectedClothes = categoriesData.clothes.find(i => i.selected);
            const selectedBag = categoriesData.bags.find(i => i.selected);

            const dressEl = document.getElementById('barbieDress');
            const bagEl = document.getElementById('barbieBag');
            const barbieDoll = document.getElementById('barbieDoll');

            if (selectedClothes && dressEl) {
                dressEl.setAttribute('fill', selectedClothes.color || '#ab8beb');
            }
            if (selectedBag && bagEl) {
                bagEl.setAttribute('fill', selectedBag.color || '#9575cd');
            }

            // 触发优雅旋转换装动画
            barbieDoll.style.transform = 'rotateY(360deg)';
            setTimeout(() => {
                barbieDoll.style.transform = 'rotateY(0deg)';
            }, 600);
        }

        // 初始化
        window.onload = () => {
            renderCategoryFrames();
        };
    </script>
</body>
</html>
