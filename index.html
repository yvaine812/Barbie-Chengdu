<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>成都天气与芭比换装小程序</title>
    <style>
        :root {
            --bg-lavender: #f0e6ff;
            --main-purple: #9d8ec7;
            --dark-purple: #5c4e8c;
            --light-purple: #f8f4ff;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.9);
            --card-shadow: 0 8px 24px rgba(157, 142, 199, 0.18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e8ddf5 0%, #f3ebfc 50%, #e5d8f6 100%);
            color: var(--dark-purple);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            height: 92vh;
            max-height: 880px;
            background: rgba(248, 244, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 36px;
            border: 2px solid var(--glass-border);
            box-shadow: 0 16px 40px rgba(118, 93, 161, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .header-bar {
            padding: 12px 20px 8px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            background: linear-gradient(45deg, #6c529d, #a272c4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 8px 12px 12px;
            min-height: 0;
        }

        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .left-panel, .right-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
        }

        /* 天气与熊猫 */
        .weather-panda-card {
            height: 48%;
            position: relative;
            background: linear-gradient(180deg, #e8eaf6 0%, #f3e5f5 100%);
        }

        .weather-info {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.65);
            padding: 6px 10px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .weather-city { font-size: 11px; font-weight: 700; color: var(--dark-purple); }
        .weather-temp { font-size: 16px; font-weight: 800; color: #6a4fa3; }

        #pandaCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 左下穿搭分类 */
        .outfit-selector-card {
            height: 52%;
            padding: 8px;
            display: flex;
            flex-direction: column;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--dark-purple);
            margin-bottom: 6px;
        }

        .category-tabs {
            display: flex;
            gap: 2px;
            background: rgba(220, 205, 240, 0.4);
            padding: 3px;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 10px;
            padding: 4px 0;
            border-radius: 7px;
            color: #6b5c8d;
            font-weight: 600;
            cursor: pointer;
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--dark-purple);
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .grid-container {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            overflow-y: auto;
        }

        .item-frame {
            aspect-ratio: 1;
            border: 2px dashed rgba(157, 142, 199, 0.4);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            padding: 4px;
        }

        .item-frame.selected {
            border: 2px solid #8e62d4;
            background: rgba(240, 230, 255, 0.85);
            box-shadow: 0 0 8px rgba(142, 98, 212, 0.3);
        }

        .item-preview {
            width: 100%;
            height: 70%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        .item-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .frame-label {
            font-size: 9px;
            color: #7d6b9d;
            text-align: center;
            margin-top: 2px;
            font-weight: 600;
        }

        /* 右上芭比 3D 场景 */
        .barbie-avatar-card {
            height: 72%;
            position: relative;
            background: radial-gradient(circle at 50% 40%, rgba(255, 245, 255, 1) 0%, rgba(230, 215, 250, 0.7) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #barbieCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .style-tag {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 9px;
            color: var(--dark-purple);
            font-weight: 600;
        }

        /* 右下任务列表 */
        .task-list-card {
            height: 28%;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .task-items {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.5);
            padding: 4px 6px;
            border-radius: 8px;
        }

        .task-checkbox {
            width: 14px;
            height: 14px;
            accent-color: #8e62d4;
        }

        .task-text {
            color: #554477;
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 10px;
        }

        .action-bar {
            padding: 8px 12px 12px;
        }

        .apply-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #ab8beb 0%, #8865d4 100%);
            color: white;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(136, 101, 212, 0.35);
            cursor: pointer;
        }

        .file-input { display: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header-bar">
            <span style="font-size: 12px;">🌸 成都</span>
            <span class="header-title">CHENGDU OUTFIT</span>
            <span style="font-size: 12px;">✨ 芭比换装</span>
        </div>

        <div class="main-content">
            <!-- 左侧面板 -->
            <div class="left-panel">
                <!-- 天气与大熊猫动态背景 -->
                <div class="glass-card weather-panda-card">
                    <div class="weather-info">
                        <div>
                            <div class="weather-city">成都 · 熊猫基地</div>
                            <div style="font-size: 9px; color: #7d6b9d;">清爽秋季 · 适宜出行</div>
                        </div>
                        <div class="weather-temp">22°C</div>
                    </div>
                    <canvas id="pandaCanvas"></canvas>
                </div>

                <!-- 穿搭分类选择框 -->
                <div class="glass-card outfit-selector-card">
                    <div class="section-title">👔 穿搭选择框</div>
                    <div class="category-tabs">
                        <button class="tab-btn active" onclick="switchCategory('clothes')">衣服</button>
                        <button class="tab-btn" onclick="switchCategory('acc')">配饰</button>
                        <button class="tab-btn" onclick="switchCategory('shoes')">鞋子</button>
                        <button class="tab-btn" onclick="switchCategory('bags')">包包</button>
                    </div>
                    <div class="grid-container" id="gridContainer"></div>
                </div>
            </div>

            <!-- 右侧面板 -->
            <div class="right-panel">
                <!-- 真人卡通 3D 芭比形象 -->
                <div class="glass-card barbie-avatar-card">
                    <canvas id="barbieCanvas"></canvas>
                    <div class="style-tag">✨ 清冷可爱 · 芭比公主</div>
                </div>

                <!-- 3行可勾选任务清单 -->
                <div class="glass-card task-list-card">
                    <div class="section-title">📝 今日打卡清单</div>
                    <div class="task-items">
                        <div class="task-item">
                            <input type="checkbox" class="task-checkbox" checked>
                            <input type="text" class="task-text" value="选一套清冷淡紫色搭配">
                        </div>
                        <div class="task-item">
                            <input type="checkbox" class="task-checkbox">
                            <input type="text" class="task-text" value="成都熊猫基地打卡合影">
                        </div>
                        <div class="task-item">
                            <input type="checkbox" class="task-checkbox">
                            <input type="text" class="task-text" value="拍一张芭比公主风格卡">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="action-bar">
            <button class="apply-btn" onclick="applyOutfit()">✨ 生成到右边芭比形象</button>
        </div>
    </div>

    <input type="file" id="imageUploader" class="file-input" accept="image/*" onchange="handleImageUpload(event)">

    <script>
        // 内置默认穿搭与矢量/图片数据
        const categoriesData = {
            clothes: [
                { id: 'c1', name: '淡紫风衣', icon: '🧥', color: '#ab8beb', selected: true },
                { id: 'c2', name: '清冷毛衣', icon: '👔', color: '#d1c4e9', selected: false },
                { id: 'c3', name: '添加图片', isUploadSlot: true }
            ],
            acc: [
                { id: 'a1', name: '珍珠发带', icon: '👑', color: '#ffffff', selected: true },
                { id: 'a2', name: '复古墨镜', icon: '🕶️', color: '#90a4ae', selected: false },
                { id: 'a3', name: '添加图片', isUploadSlot: true }
            ],
            shoes: [
                { id: 's1', name: '芭比马丁靴', icon: '👢', color: '#f48fb1', selected: true },
                { id: 's2', name: '银色长靴', icon: '👠', color: '#cfd8dc', selected: false },
                { id: 's3', name: '添加图片', isUploadSlot: true }
            ],
            bags: [
                { id: 'b1', name: '淡紫链条包', icon: '👜', color: '#9575cd', selected: true },
                { id: 'b2', name: '可爱竹编包', icon: '🛍️', color: '#d7ccc8', selected: false },
                { id: 'b3', name: '添加图片', isUploadSlot: true }
            ]
        };

        let currentCategory = 'clothes';
        let barbieState = { dressColor: '#ab8beb', bagColor: '#9575cd', angle: 0 };

        // 渲染左下穿搭框架
        function renderCategoryFrames() {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';

            categoriesData[currentCategory].forEach(item => {
                const frame = document.createElement('div');
                frame.className = `item-frame ${item.selected ? 'selected' : ''}`;

                if (item.isUploadSlot) {
                    frame.innerHTML = `<div class="item-preview" style="font-size:20px;color:#9d8ec7;">➕</div><div class="frame-label">加入图片</div>`;
                    frame.onclick = () => document.getElementById('imageUploader').click();
                } else if (item.img) {
                    frame.innerHTML = `<div class="item-preview"><img src="${item.img}" /></div><div class="frame-label">${item.name}</div>`;
                    frame.onclick = () => selectFrame(item.id);
                } else {
                    frame.innerHTML = `<div class="item-preview">${item.icon}</div><div class="frame-label">${item.name}</div>`;
                    frame.onclick = () => selectFrame(item.id);
                }
                container.appendChild(frame);
            });
        }

        function switchCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', ['clothes', 'acc', 'shoes', 'bags'][idx] === cat);
            });
            renderCategoryFrames();
        }

        function selectFrame(id) {
            categoriesData[currentCategory].forEach(i => i.selected = (i.id === id));
            renderCategoryFrames();
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const list = categoriesData[currentCategory];
                const newId = 'upload_' + Date.now();
                list.unshift({ id: newId, name: '自定义', img: evt.target.result, color: '#ab8beb', selected: true });
                list.forEach(i => { if (i.id !== newId) i.selected = false; });
                renderCategoryFrames();
            };
            reader.readAsDataURL(file);
        }

        // 1. 绘制左上：熊猫基地与动态大熊猫
        function initPandaCanvas() {
            const cvs = document.getElementById('pandaCanvas');
            const ctx = cvs.getContext('2d');
            
            function resize() {
                cvs.width = cvs.parentElement.clientWidth || 180;
                cvs.height = cvs.parentElement.clientHeight || 180;
            }
            resize();

            let time = 0;
            function draw() {
                time += 0.04;
                const w = cvs.width, h = cvs.height;
                ctx.clearRect(0, 0, w, h);

                // 竹林背景
                ctx.fillStyle = '#eaf4eb';
                ctx.fillRect(0, 0, w, h);

                // 竹子
                ctx.fillStyle = '#a8e6cf';
                for(let i=0; i<4; i++){
                    let bx = w * 0.25 * i + 15;
                    ctx.fillRect(bx, 0, 6, h);
                }

                // 熊猫位置
                let px = w * 0.5, py = h * 0.65;
                let bounce = Math.sin(time * 2) * 2;

                // 身体
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(px, py + 10, 26, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#333'; ctx.stroke();

                // 耳朵与手臂
                ctx.fillStyle = '#333333';
                ctx.beginPath(); ctx.arc(px - 18, py - 22 + bounce, 7, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + 18, py - 22 + bounce, 7, 0, Math.PI*2); ctx.fill();

                // 头部
                ctx.fillStyle = '#ffffff';
                ctx.beginPath(); ctx.arc(px, py - 8 + bounce, 20, 0, Math.PI*2); ctx.fill(); ctx.stroke();

                // 眼睛与腮红
                ctx.fillStyle = '#333';
                ctx.beginPath(); ctx.arc(px - 7, py - 9 + bounce, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + 7, py - 9 + bounce, 3, 0, Math.PI*2); ctx.fill();

                ctx.fillStyle = '#ffb7b2';
                ctx.beginPath(); ctx.arc(px - 12, py - 4 + bounce, 3.5, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(px + 12, py - 4 + bounce, 3.5, 0, Math.PI*2); ctx.fill();

                requestAnimationFrame(draw);
            }
            draw();
        }

        // 2. 绘制右侧：真人卡通芭比形象 Canvas
        function initBarbieCanvas() {
            const cvs = document.getElementById('barbieCanvas');
            const ctx = cvs.getContext('2d');

            function resize() {
                cvs.width = cvs.parentElement.clientWidth || 200;
                cvs.height = cvs.parentElement.clientHeight || 280;
            }
            resize();

            let t = 0;
            function draw() {
                t += 0.03;
                const w = cvs.width, h = cvs.height;
                ctx.clearRect(0, 0, w, h);

                let cx = w * 0.5;
                let cy = h * 0.5 + Math.sin(t) * 3; // 呼吸起伏

                // 芭比长发 (金色)
                ctx.fillStyle = '#ffe082';
                ctx.beginPath(); ctx.arc(cx, cy - 40, 38, 0, Math.PI*2); ctx.fill();

                // 身体与裙子
                ctx.fillStyle = barbieState.dressColor;
                ctx.beginPath();
                ctx.moveTo(cx - 15, cy - 10);
                ctx.lineTo(cx + 15, cy - 10);
                ctx.lineTo(cx + 35, cy + 50);
                ctx.lineTo(cx - 35, cy + 50);
                ctx.closePath();
                ctx.fill();

                // 面部 (真人卡通轮廓)
                ctx.fillStyle = '#ffedd8';
                ctx.beginPath(); ctx.arc(cx, cy - 40, 24, 0, Math.PI*2); ctx.fill();

                // 芭比大眼睛
                ctx.fillStyle = '#3a86ff';
                ctx.beginPath(); ctx.arc(cx - 8, cy - 42, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(cx + 8, cy - 42, 4, 0, Math.PI*2); ctx.fill();

                // 睫毛与唇彩
                ctx.fillStyle = '#ff70a6';
                ctx.beginPath(); ctx.arc(cx, cy - 32, 3, 0, Math.PI); ctx.fill();

                // 手提包
                ctx.fillStyle = barbieState.bagColor;
                ctx.fillRect(cx + 22, cy + 10, 16, 14);

                requestAnimationFrame(draw);
            }
            draw();
        }

        // 生成更换穿搭
        function applyOutfit() {
            const selectedClothes = categoriesData.clothes.find(i => i.selected);
            const selectedBag = categoriesData.bags.find(i => i.selected);

            if (selectedClothes) barbieState.dressColor = selectedClothes.color || '#ab8beb';
            if (selectedBag) barbieState.bagColor = selectedBag.color || '#9575cd';
        }

        window.onload = () => {
            renderCategoryFrames();
            setTimeout(() => {
                initPandaCanvas();
                initBarbieCanvas();
            }, 100);
        };
    </script>
</body>
</html>
